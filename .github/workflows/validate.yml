name: Validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ── 1. Skill validation (official reference validator) ──
      - name: Install skills-ref
        run:           npm install -g skills-ref

      - name: Validate each skill
        run: |
          # Validate every SKILL.md at exactly depth 4 (plugins/<plugin>/skills/<skill>/SKILL.md)
          find plugins -mindepth 4 -maxdepth 4 -name SKILL.md -exec dirname {} \; \
            | xargs -n1 bin/validate-skill

          # Fail if any SKILL.md exists at any other depth
          find plugins -name SKILL.md -not -path 'plugins/*/skills/*/SKILL.md' -print \
            | grep . && { echo "ERROR: SKILL.md found outside immediate skill directories"; exit 1; } || true

      # ── 2. Plugin manifest validation ──
      - name: Validate plugin manifests
        run: |
          for plugin_dir in plugins/*/; do
            plugin_name=$(basename "$plugin_dir")
            manifest="$plugin_dir/plugin.json"

            if [ ! -f "$manifest" ]; then
              echo "ERROR: Missing plugin.json in plugins/$plugin_name"
              exit 1
            fi

            # Check manifest name matches directory name
            manifest_name=$(python3 -c "import json; print(json.load(open('$manifest'))['name'])")
            if [ "$manifest_name" != "$plugin_name" ]; then
              echo "ERROR: Manifest name '$manifest_name' does not match directory '$plugin_name'"
              exit 1
            fi

            # Check $schema is present and pinned to 1.0.0
            schema=$(python3 -c "import json; print(json.load(open('$manifest')).get('\$schema',''))")
            if [ -z "$schema" ]; then
              echo "ERROR: Missing \$schema in plugins/$plugin_name/plugin.json"
              exit 1
            fi
            if [[ "$schema" != *"1.0.0"* ]]; then
              echo "ERROR: \$schema must pin to 1.0.0 in plugins/$plugin_name/plugin.json"
              exit 1
            fi

            echo "OK: $plugin_name"
          done

      # ── 3. Layout checks: skill-name uniqueness ──
      - name: Check skill name uniqueness
        run: |
          # Collect all skill directory names and check for duplicates
          names=$(find plugins -mindepth 4 -maxdepth 4 -name SKILL.md -exec dirname {} \; \
            | xargs -n1 basename | sort)
          duplicates=$(echo "$names" | uniq -d)
          if [ -n "$duplicates" ]; then
            echo "ERROR: Duplicate skill names across plugins:"
            echo "$duplicates"
            exit 1
          fi
          echo "All skill names are unique."

      # ── 4. Description quality: must contain the full sentence "This skill should be used when" ──
      - name: Check description quality
        run: |
          for skill_md in $(find plugins -mindepth 4 -maxdepth 4 -name SKILL.md); do
            if ! python3 -c "
          import yaml, sys
          with open('$skill_md') as f:
              doc = yaml.safe_load(f.read().split('---')[1])
          desc = doc.get('description', '')
          if 'this skill should be used when' not in desc.lower():
              print(f'ERROR: $skill_md description lacks a full use-when sentence')
              sys.exit(1)
          "; then exit 1; fi
          done
          echo "All descriptions contain the full use-when sentence."

      # ── 5. Context budget: fail >500 lines, warn >300 ──
      - name: Check SKILL.md line counts
        run: |
          for skill_md in $(find plugins -mindepth 4 -maxdepth 4 -name SKILL.md); do
            lines=$(wc -l < "$skill_md" | tr -d ' ')
            if [ "$lines" -gt 500 ]; then
              echo "ERROR: $skill_md is $lines lines (max 500)"
              exit 1
            elif [ "$lines" -gt 300 ]; then
              echo "WARNING: $skill_md is $lines lines (recommended <300)"
            fi
          done

      # ── 6. Link integrity: relative refs resolve, one level deep ──
      - name: Check reference integrity
        run: |
          for skill_dir in $(find plugins -mindepth 4 -maxdepth 4 -name SKILL.md -exec dirname {} \;); do
            # Extract relative paths from SKILL.md body (references/ and scripts/ and assets/)
            refs=$(grep -oP '(?:references|scripts|assets)/[A-Za-z0-9_\-]+\.[a-z]+' "$skill_dir/SKILL.md" 2>/dev/null || true)
            for ref in $refs; do
              full_path="$skill_dir/$ref"
              if [ ! -e "$full_path" ]; then
                echo "ERROR: Broken reference in $skill_dir/SKILL.md: $ref"
                exit 1
              fi
              # Check one level deep: path should not contain nested directories
              depth=$(echo "$ref" | tr -cd '/' | wc -c)
              if [ "$depth" -gt 1 ]; then
                echo "ERROR: Reference $ref in $skill_dir is more than one level deep"
                exit 1
              fi
            done
          done
          echo "All references resolve and are one level deep."

      # ── 7. Data hygiene: secret scan + pattern checks ──
      - name: Check for personal data patterns
        run: |
          # Reject IBAN-shaped strings (DK + 16 digits, or generic IBAN pattern)
          if grep -rnP '[A-Z]{2}[0-9]{2}[A-Z0-9]{10,30}' plugins/ 2>/dev/null; then
            echo "ERROR: IBAN-shaped string found in plugins/"
            exit 1
          fi

          # Reject long digit runs (12+ consecutive digits)
          if grep -rnP '[0-9]{12,}' plugins/ 2>/dev/null; then
            echo "ERROR: Long digit run found in plugins/"
            exit 1
          fi

          # Reject committed data files
          found_files=$(find plugins -name '*.csv' -o -name '*.ofx' -o -name '*.qif' 2>/dev/null || true)
          if [ -n "$found_files" ]; then
            echo "ERROR: Data files (csv/ofx/qif) found in plugins/"
            echo "$found_files"
            exit 1
          fi

          echo "No personal data patterns detected."

      # ── 8. Script lint: shellcheck + syntax check ──
      - name: Lint scripts
        run: |
          # Shellcheck for shell scripts (hard fail)
          find plugins bin -name '*.sh' -exec shellcheck {} +
          shellcheck bin/setup

          # Python syntax check (hard fail on syntax errors)
          python3 -m py_compile bin/skillctl bin/validate-skill
          find plugins -path '*/scripts/*.py' -exec python3 -m py_compile {} +

      # ── 9. Drift check: duplicated scripts must stay in sync ──
      - name: Check duplicated scripts are in sync
        run: |
          diff -q \
            plugins/pm/skills/standup-summary/scripts/parse_slack_overflow.py \
            plugins/pm/skills/prioritize-tasks/scripts/parse_slack_overflow.py
